# Runs every check `npm run check` runs on a laptop, on each platform the repo
# supports. The checks need no secrets and never read .env. Here they run one at a
# time, each its own step: run all at once, as on a laptop, they starve a runner's
# three cores until tests time out.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv takes the Python version from .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: stable

      - run: uv sync --locked

      - run: npm ci

      # Only Linux needs the browser's system libraries installed.
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium

      - run: npm run check:python
      - run: npm run check:app
      - run: npm run check:ts
      - run: npm run check:rust
      - run: npm run check:bundle
      - run: npm run check:scripts
      - run: npm run e2e

      # A failed e2e test's trace and screenshot, from the synthetic library only.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.os }}
          path: e2e/test-results
          retention-days: 14
